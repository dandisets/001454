description: 'This dandiset contains data used in the publication: Patel, R.R., Kim,
  K.N., Patarino, M. et al. Social isolation recruits amygdala–medial prefrontal cortex
  projections to escalate alcohol drinking in male mice. Nat Neurosci (2026). https://doi.org/10.1038/s41593-026-02413-x.  This
  dandiset includes in vivo calcium imaging of the basolateral amygdala-medial prefrontal
  cortex circuit in mice during two different behavioral paradigms, as well as behavioral
  videos with pose tracking, and histological images. It also includes the raw whole-cell
  current clamp recordings highlighted in the journal article.  An earlier version
  of this paper was published under Patel RR, Patarino M, Kim K, Pamintuan R, Taschbach
  FH, Li H, Lee CR, van Hoek A, Castro R, Cazares C, Miranda RL, Jia C, Delahanty
  J, Batra K, Keyes LR, Libster A, Wichmann R, Pereira TD, Benna MK, Tye KM. "Social
  isolation recruits amygdala-cortical circuitry to escalate alcohol drinking." bioRxiv:
  2023 Nov 10 doi: https://doi.org/10.1101/2023.11.09.566421.  '
